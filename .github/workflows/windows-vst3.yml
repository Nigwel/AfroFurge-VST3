name: Windows VST3 build and installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Compile Windows VST3
        run: cmake --build build --config Release --target AFROGRID_VST3 --parallel 4
      - name: Locate compiled VST3
        shell: pwsh
        run: |
          $p = Get-ChildItem -Path build -Directory -Recurse -Filter 'AFROGRID.vst3' | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $p) { throw 'VST3 bundle not found' }
          "VST3_SOURCE=$($p.FullName)" >> $env:GITHUB_ENV
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\NSIS\makensis.exe' "/DVST3_SOURCE=$env:VST3_SOURCE" AFROGRID.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AFROGRID-Windows-x64-VST3-and-installer
          path: |
            build/**/Release/VST3/AFROGRID.vst3/**
            AFROGRID_Setup_Windows_x64.exe
          if-no-files-found: error
